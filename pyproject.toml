[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velibpulse-datalake"
version = "1.0.0"
description = "Data lake de suivi de la disponibilite Velib' - projet EFREI BDML2"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jacq VENGADESAN"}]
dependencies = [
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg2-binary>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  # Airflow 2.10 repose encore sur SQLAlchemy 1.4 ; le code reste compatible avec cette API.
  "sqlalchemy>=1.4.36,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
